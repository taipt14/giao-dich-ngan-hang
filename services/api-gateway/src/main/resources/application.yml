spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Gia tri claim "iss" phai khop. Khong goi discovery luc khoi dong vi da khai bao jwk-set-uri
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank}
          # Tach rieng voi issuer: trong docker, gateway lay khoa qua host noi bo nhung "iss" van la localhost
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank/protocol/openid-connect/certs}
          # Chi nhan token cap cho gateway (client bank-gateway trong realm bank)
          audiences: bank-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Don vi ms. Service phia sau khong ket noi duoc / khong tra loi kip → gateway tra 503
            connect-timeout: 2000
            response-timeout: 10s
          routes:
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/customers/**
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/accounts/**
            - id: transfer-service
              uri: ${TRANSFER_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/transfers/**

server:
  port: 8080
