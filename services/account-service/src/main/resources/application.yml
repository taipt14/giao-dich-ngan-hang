spring:
  application:
    name: account-service
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    # Moi service chi dang nhap bang user/schema cua chinh no (Oracle: user = schema)
    username: ACCOUNT_SVC
    # Mat khau doc tu bien moi truong, gia tri mau trong infra/.env.example
    password: ${ACCOUNT_SVC_DB_PASSWORD}
    hikari:
      pool-name: account-service-pool
      maximum-pool-size: 10
      minimum-idle: 2
      # Don vi ms. Het connection thi bao loi sau 5s thay vi treo request 30s (mac dinh)
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      # Thay connection dinh ky de khong giu connection da bi firewall/DB ngat
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quan ly, Hibernate chi kiem tra khop
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Instant luu vao cot TIMESTAMP (gia tri UTC), khong dung TIMESTAMP WITH TIME ZONE
          preferred_instant_jdbc_type: TIMESTAMP
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      # Redis chi dung de cache so du hien thi (BANK-021)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis cham/chet khong duoc giu request lau: het thoi gian thi doc so du tu DB
      connect-timeout: 500ms
      timeout: 500ms
  http:
    clients:
      # Goi service khac khong duoc treo request lau: loi ket noi/timeout tra 503 cho client retry
      connect-timeout: 2s
      read-timeout: 5s

management:
  health:
    redis:
      # Redis chet thi API van doc so du tu DB nen Redis khong lam health DOWN
      enabled: false

server:
  port: 8082

bank:
  account:
    customer-service:
      base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    balance-cache:
      # Muc 6 kien-truc.md: cache so du balance:{accountNo} song 5 phut
      ttl: 5m
