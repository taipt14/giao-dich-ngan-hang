spring:
  application:
    name: transfer-service
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    # Moi service chi dang nhap bang user/schema cua chinh no (Oracle: user = schema)
    username: TRANSFER_SVC
    # Mat khau doc tu bien moi truong, gia tri mau trong infra/.env.example
    password: ${TRANSFER_SVC_DB_PASSWORD}
    hikari:
      pool-name: transfer-service-pool
      maximum-pool-size: 10
      minimum-idle: 2
      # Don vi ms. Het connection thi bao loi sau 5s thay vi treo request 30s (mac dinh)
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      # Thay connection dinh ky de khong giu connection da bi firewall/DB ngat
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quan ly, Hibernate chi kiem tra khop
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Instant luu vao cot TIMESTAMP (gia tri UTC), khong dung TIMESTAMP WITH TIME ZONE
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      # Lop idempotency thu nhat (BANK-041); Redis loi o luong bat buoc nay tra 503 (muc 12 convention)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  http:
    clients:
      # Goi service khac khong duoc treo request lau: loi ket noi/timeout tra 503 cho client retry
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: 8084

bank:
  transfer:
    account-service:
      base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    idempotency:
      # Muc 6 kien-truc.md: key idem:{clientId}:{idempotencyKey} song 24h
      ttl: 24h
    otp:
      # Muc 6 kien-truc.md: otp:{transferId} va otp:fail:{transferId} song 3 phut
      ttl: 3m
      # Sai lan thu 5 → lenh FAILED (OTP_MAX_ATTEMPTS)
      max-attempts: 5
      max-resend: 3
      resend-interval: 30s
      # Bo dem otp:resend:{transferId} phai song lau hon OTP, de het OTP roi van khong gui lai qua so lan
      resend-counter-ttl: 24h
      # Chi bat o moi truong dev (profile local): ghi OTP dang ro ra log thay cho SMS
      dev-log-enabled: false
