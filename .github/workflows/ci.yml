name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Push moi len cung branch/PR thi huy lan chay cu, tranh ton runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Lan dau phai pull image Oracle Free, Kafka, Redis cho Testcontainers
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw duoc commit tu Windows voi mode 100644, runner Linux can quyen thuc thi
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Runner ubuntu co san Docker nen Testcontainers (Oracle, Kafka, Redis) chay duoc
      - name: Build and verify
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
