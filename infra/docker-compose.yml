# Ha tang local cho he thong giao dich ngan hang: Oracle, Kafka (KRaft), Kafka UI, Redis, Keycloak.
# Bien moi truong doc tu infra/.env (copy tu infra/.env.example). Huong dan: infra/README.md
name: giao-dich-ngan-hang

services:

  oracle:
    image: gvenzl/oracle-free:23.6-slim-faststart
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?ORACLE_PASSWORD is required}
      CUSTOMER_SVC_DB_PASSWORD: ${CUSTOMER_SVC_DB_PASSWORD:?CUSTOMER_SVC_DB_PASSWORD is required}
      ACCOUNT_SVC_DB_PASSWORD: ${ACCOUNT_SVC_DB_PASSWORD:?ACCOUNT_SVC_DB_PASSWORD is required}
      TRANSFER_SVC_DB_PASSWORD: ${TRANSFER_SVC_DB_PASSWORD:?TRANSFER_SVC_DB_PASSWORD is required}
      NAPAS_SVC_DB_PASSWORD: ${NAPAS_SVC_DB_PASSWORD:?NAPAS_SVC_DB_PASSWORD is required}
      NOTI_SVC_DB_PASSWORD: ${NOTI_SVC_DB_PASSWORD:?NOTI_SVC_DB_PASSWORD is required}
      FRAUD_SVC_DB_PASSWORD: ${FRAUD_SVC_DB_PASSWORD:?FRAUD_SVC_DB_PASSWORD is required}
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Script init chi chay lan dau, khi volume oracle-data con trong
      - ./oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      # healthcheck.sh cua image chi kiem tra PDB da mo; dang nhap them bang FRAUD_SVC
      # (schema tao cuoi cung) de chac chan script init da chay xong truoc khi bao healthy
      test: ["CMD-SHELL", "healthcheck.sh && echo exit | sqlplus -s -L \"FRAUD_SVC/$${FRAUD_SVC_DB_PASSWORD}@localhost:1521/FREEPDB1\" > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL cho container trong compose (kafka:29092), EXTERNAL cho service chay tren may (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Chi co 1 broker nen replication factor cua topic noi bo phai la 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    # start-dev: HTTP, luu du lieu bang file H2 noi bo cua Keycloak (chi dung local).
    # --import-realm: doc /opt/keycloak/data/import luc khoi dong, bo qua neu realm da ton tai
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      # Keycloak thay placeholder ${...} trong file realm bang bien moi truong khi import
      KEYCLOAK_CUSTOMER01_PASSWORD: ${KEYCLOAK_CUSTOMER01_PASSWORD:?KEYCLOAK_CUSTOMER01_PASSWORD is required}
      KEYCLOAK_ADMIN01_PASSWORD: ${KEYCLOAK_ADMIN01_PASSWORD:?KEYCLOAK_ADMIN01_PASSWORD is required}
    volumes:
      - ./keycloak/realm-bank.json:/opt/keycloak/data/import/realm-bank.json:ro
    healthcheck:
      # Image khong co curl/wget: goi endpoint health (management port 9000) bang /dev/tcp cua bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  oracle-data:
  kafka-data:
